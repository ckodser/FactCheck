<!DOCTYPE html>
<html>
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.2/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        /* Ensure full height body without cutting off the top */
        body {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: flex-start; /* Align content to the top */
            align-items: center;
            height: 100vh; /* Full viewport height */
        }

        /* Make sure the content area is centered */
        .container {
            width: 70%; /* Set the width of the container */
            padding: 20px; /* Add padding around the container */
            margin-top: 20px; /* Add some space from the top */
        }

        /* Styling for the text box displaying the input */
        .text-box {
            border: 1px solid black;
            background-color: #f9f9e9;
            padding: 15px;
            margin-bottom: 20px; /* Space between the input and results */
        }

        .text-box p {
            margin: 0;
            line-height: 1.5;
            text-align: right;
        }

        /* Styling for the results section */
        .results-section {
            background-color: #f9f9f9;
            border: 1px solid black;
            padding: 20px;
        }

        .result-item {
            margin-bottom: 15px;
            padding: 10px;
            border: 1px solid #ccc;
            background-color: #fff;
        }

        .result-item h5 {
            margin: 0;
        }

        .result-item p {
            margin-top: 10px;
            line-height: 1.5;
            text-align: right;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Display the original input text -->
        <div class="text-box">
            <p>{{ text }}</p>
        </div>

        <!-- Display the top matches -->
        <div class="results-section">
            <h3>Top Matches</h3>
            {% if top_matches %}
                {% for index, score, matched_text in top_matches %}
                    <div class="result-item">
                        <h5><strong>Document Index:</strong> {{ index }}</h5>
                        <p><strong>Score:</strong> {{ score|floatformat:4 }}</p>
                        <p><strong>Text:</strong> {{ matched_text }}</p>
                    </div>
                    <hr>
                {% endfor %}
            {% else %}
                <p>No matches found.</p>
            {% endif %}
        </div>
    </div>

</body>
</html>
